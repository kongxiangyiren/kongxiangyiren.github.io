<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      title / description 由 plugins/vite-plugin-blog-content.ts 在构建期从
      src/config/site.ts 注入，这里刻意留空，避免站点名出现两份。
    -->
    <title></title>
    <meta name="description" content="">
    <!--
      防 FOUC：必须在 <head> 里同步执行（阻塞式），首屏绘制前就定好 data-theme 和 .dark，
      否则暗色用户刷新时会看到一帧白闪。
      storage key 必须与 src/composables/useTheme.ts 的 THEME_STORAGE_KEY 保持一致。
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('blog-theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var root = document.documentElement
          root.dataset.theme = theme
          root.classList.toggle('dark', theme === 'dark')
          root.style.colorScheme = theme
        } catch (e) {
          // localStorage / matchMedia 不可用时安全降级到亮色
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
