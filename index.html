<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      这个文件是**预渲染用的 HTML 外壳**，由 src/entry-server.ts 用 `?raw` 读入后填充：

        · head 末尾的 `ssr-assets` 占位注释 → 换成真实资源标签（带 hash 的 CSS / 入口 JS）
        · body 里 `#app` 内的 `app-outlet` 占位注释 → 换成服务端渲染出的 DOM

      （上面两个占位符刻意只写名字、不写完整注释定界符：写全了会被 shellTemplate 的
      字符串替换先命中本注释，反而给不到真正的位置。）

      两处刻意**不在这里**：
        · <title> / <meta name="description"> → 由 unhead 按当前路由产出
          （见 src/composables/useSeo.ts）。客户端与服务端同一份逻辑，所以不会出现两份标题，
          预渲染出来的每页标题也因此各不相同（详情页是文章名）。
        · 客户端入口 <script> → 构建期注入到上面的 ssr-assets 处，文件名带 hash。

      它**不是** Vite 的客户端入口（入口是 src/main.ts，见 vite.config.ts 的 environments.client），
      所以不再经过 Vite 的 HTML 插件；改了外壳重新构建即可生效。
    -->
    <!--
      防 FOUC：必须在 <head> 里同步执行（阻塞式），首屏绘制前就定好 data-theme 和 .dark，
      否则暗色用户刷新时会看到一帧白闪。
      storage key 必须与 src/composables/useTheme.ts 的 THEME_STORAGE_KEY 保持一致。
      位置刻意排在资源标签**之前**：这样它不会被等待中的样式表拖住执行。
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('blog-theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
        } catch (e) {
          // localStorage / matchMedia 不可用时安全降级到亮色
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <!--ssr-assets-->
  </head>
  <body>
    <div id="app"><!--app-outlet--></div>
  </body>
</html>
